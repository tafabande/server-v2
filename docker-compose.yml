version: '3.8'

services:
  mediahub-api:
    build: .
    image: ${REGISTRY_PREFIX:-local}/mediahub:latest
    container_name: mediahub-server
    restart: unless-stopped
    ports:
      - "51733:51733"
    volumes:
      # Absolute host path mappings for reliability
      - ./shared_media:/app/shared_media:ro # Media is read-only for safety
      - ./thumbs:/app/thumbs
      - ./logs:/app/logs
      - ./temp:/app/temp
      - ./data:/app/data # Consolidate DB and app state
      - ./.env:/app/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: mediahub-redis
    command: redis-server --appendonly yes # Enable AOF persistence
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - mediahub-net

networks:
  mediahub-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
