<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediaHub</title>
    <link rel="icon" type="image/svg+xml" href="/static/placeholder.svg">
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div class="ambient-backdrop" aria-hidden="true">
      <div class="aurora aurora-one"></div>
      <div class="aurora aurora-two"></div>
      <div class="aurora aurora-three"></div>
    </div>
    <div class="screen-noise" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <div id="boot-loader" class="boot-loader">
      <div class="loader-content">
        <div class="spinner"></div>
        <p>Initializing MediaHub...</p>
      </div>
    </div>

    <div class="app-shell">
      <aside class="sidebar" hidden>
        <div class="sidebar-brand">
          <h1 class="brand-text">MediaHub</h1>
          <p class="brand-tag">LAN VAULT</p>
        </div>
        
        <nav class="sidebar-nav">
          <a href="/" class="nav-link" data-link>
            <span class="nav-icon">home</span>
            <span class="nav-label">Home</span>
          </a>
          <a href="/library" class="nav-link" data-link>
            <span class="nav-icon">grid_view</span>
            <span class="nav-label">Library</span>
          </a>
          <a href="/explorer" class="nav-link" data-link>
            <span class="nav-icon">folder_open</span>
            <span class="nav-label">Explorer</span>
          </a>
          <hr class="nav-divider">
          <a href="/admin" class="nav-link admin-only" data-link hidden>
            <span class="nav-icon">dashboard</span>
            <span class="nav-label">Admin</span>
          </a>
          <a href="/profile" class="nav-link" data-link>
            <span class="nav-icon">person</span>
            <span class="nav-label">Profile</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <button id="logout-button" class="logout-btn">
            <span class="nav-icon">logout</span>
            <span class="nav-label">End Session</span>
          </button>
        </div>
      </aside>

      <main class="main-content" id="app-shell-content">
        <!-- Views injected here -->
      </main>
    </div>

    <dialog id="player-modal" class="player-modal">
      <div class="player-header">
        <div>
          <p class="eyebrow">Now Playing</p>
          <h3 id="player-title">MediaHub</h3>
        </div>
        <button id="player-close" class="ghost-button">Close</button>
      </div>
      <video id="player-video" controls playsinline></video>
      <p id="player-status" class="section-note player-status"></p>
    </dialog>

    <dialog id="confirm-dialog" class="action-dialog">
      <form method="dialog" class="dialog-card">
        <p class="eyebrow">Confirm Action</p>
        <h3 id="confirm-title">Confirm</h3>
        <p id="confirm-message" class="section-note"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="ghost-button">Cancel</button>
          <button id="confirm-accept" type="submit" value="confirm" class="primary-button danger-button">
            Confirm
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="prompt-dialog" class="action-dialog">
      <form id="prompt-form" class="dialog-card">
        <p class="eyebrow">Rename Item</p>
        <h3 id="prompt-title">Rename entry</h3>
        <p id="prompt-message" class="section-note"></p>
        <label class="input-stack">
          <span id="prompt-label">New name</span>
          <input id="prompt-input" type="text" maxlength="255" required />
        </label>
        <div class="dialog-actions">
          <button type="button" id="prompt-cancel" class="ghost-button">Cancel</button>
          <button type="submit" class="primary-button">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>


    <!-- Offline dependencies -->
    <script src="/static/js/hls.js"></script>
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
