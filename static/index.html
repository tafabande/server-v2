<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StreamDrop</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="icon" type="image/svg+xml" href="/static/placeholder.svg">
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div id="boot-loader" class="boot-loader">
      <div class="loader-content">
        <div class="spinner"></div>
        <p>Launching StreamDrop...</p>
      </div>
    </div>

    <div class="app-shell">
      <aside class="sidebar" hidden>
        <div class="sidebar-brand">
          <h1 class="brand-text">StreamDrop</h1>
          <p class="brand-tag">Premium Media Hub</p>
        </div>
        
        <nav class="sidebar-nav">
          <a href="/" class="nav-link" data-link>
            <span class="nav-icon">home</span>
            <span class="nav-label">Home</span>
          </a>
          <a href="/library" class="nav-link" data-link>
            <span class="nav-icon">grid_view</span>
            <span class="nav-label">Library</span>
          </a>
          <a href="/explorer" class="nav-link" data-link>
            <span class="nav-icon">folder_open</span>
            <span class="nav-label">Explorer</span>
          </a>
          <hr class="nav-divider">
          <a href="/admin" class="nav-link admin-only" data-link hidden>
            <span class="nav-icon">dashboard</span>
            <span class="nav-label">Admin</span>
          </a>
          <a href="/profile" class="nav-link" data-link>
            <span class="nav-icon">person</span>
            <span class="nav-label">Profile</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <button id="logout-button" class="btn btn-secondary">
            <span class="nav-icon">logout</span>
            <span class="nav-label">End Session</span>
          </button>
        </div>
      </aside>

      <main class="main-content" id="app-shell-content">
        <!-- Views injected here -->
      </main>
    </div>

    <dialog id="player-modal" class="player-modal glass-panel">
      <div class="player-header">
        <div>
          <p class="brand-tag">Now Playing</p>
          <h3 id="player-title">StreamDrop</h3>
        </div>
        <button id="player-close" class="btn btn-secondary">Close</button>
      </div>
      <video id="player-video" controls playsinline></video>
      <p id="player-status" class="player-status"></p>
    </dialog>

    <dialog id="confirm-dialog" class="action-dialog">
      <form method="dialog" class="glass-panel dialog-card">
        <p class="brand-tag">Confirm Action</p>
        <h3 id="confirm-title">Confirm</h3>
        <p id="confirm-message"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn btn-secondary">Cancel</button>
          <button id="confirm-accept" type="submit" value="confirm" class="btn btn-primary">
            Confirm
          </button>
        </div>
      </form>
    </dialog>

    <dialog id="prompt-dialog" class="action-dialog">
      <form id="prompt-form" class="glass-panel dialog-card">
        <p class="brand-tag">Rename Item</p>
        <h3 id="prompt-title">Rename entry</h3>
        <p id="prompt-message"></p>
        <div class="search-field">
          <input id="prompt-input" type="text" maxlength="255" required placeholder="Enter new name" />
        </div>
        <div class="dialog-actions">
          <button type="button" id="prompt-cancel" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

    <!-- Offline dependencies -->
    <script src="/static/js/hls.js"></script>
    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
