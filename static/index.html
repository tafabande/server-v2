<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MediaHub</title>
  <meta name="description" content="Minimalist LAN media server" />
  <meta name="theme-color" content="#6366f1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/static/placeholder.svg">
  <link rel="stylesheet" href="/static/css/google-fonts.css" />
  <link rel="stylesheet" href="/static/css/material-symbols.css" />
  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/player.css" />
</head>

<body>
  <div id="boot-loader" class="boot-loader">
    <div class="spinner"></div>
    <span>Loading MediaHub...</span>
  </div>

  <div class="app" id="app-root">
    <!-- Mobile Top Bar (Stitch Cinematic Design) -->
    <header id="topbar-mobile"
      class="sticky top-0 w-full z-40 flex items-center justify-between px-4 py-3 bg-surface/80 backdrop-blur-md border-b border-white/5 shadow-sm transition-all duration-300 md:hidden">
      <div class="flex items-center gap-3">
        <button id="mobile-menu-btn"
          class="p-2 -ml-2 text-on-surface hover:text-primary transition-colors focus:outline-none">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
        <h1 id="page-title" class="font-['Hanken_Grotesk'] text-xl font-bold tracking-tight text-white bg-clip-text">
          MediaHub</h1>
      </div>
      <div class="flex items-center gap-4">
        <!-- Global Search Icon -->
        <button class="text-on-surface-variant hover:text-white transition-colors"
          onclick="document.getElementById('global-search-input')?.focus()">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </button>
        <!-- User Placeholder -->
        <div id="topbar-user"
          class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-sm font-semibold text-primary border border-white/10 overflow-hidden">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd">
            </path>
          </svg>
        </div>
      </div>
    </header>

    

    
    <main class="main" id="main-area">
      <div class="content" id="view-target">
        <!-- Views injected here -->
      </div>
    </main>
  </div>

  <!-- Share Dialog -->

  <!-- Confirm Dialog -->

  <!-- PG-Lock PIN Dialog -->

  <!-- Toast Container -->
  <!-- Folder Settings Dialog -->

  <div id="toast-container" class="toast-container"></div>
  <button id="scroll-top-btn" class="scroll-top-btn" title="Scroll to Top">↑</button>

  <!-- Offline JS dependencies -->
  <!-- High-Performance Local HLS.js -->
  <script src="/static/js/hls.js"></script>

  <script type="module" src="/static/js/app.js"></script>
</body>

</html>
